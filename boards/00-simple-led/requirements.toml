schema = 1

[[requirement]]
id = "R1"
category = "electrical"
must = true
text = "The board has one LED that lights whenever 5 V is applied to the power input."
evidence = "Schematic: LED connected in a path between the +5 V input and ground; netlist."

[[requirement]]
id = "R2"
category = "electrical"
must = true
text = "An on-board current limit sets the LED current to about 10 mA at 5 V (a standard value landing slightly below 10 mA is fine), within the LED's continuous rating."
evidence = "Schematic values; calculation from (5 V - LED Vf) / R in DECISIONS.md; LED datasheet rating."

[[requirement]]
id = "R3"
category = "interface"
must = true
text = "Power enters through a 2-pin, 2.54 mm pitch connector carrying +5 V and ground."
evidence = "Schematic connector symbol; PCB footprint pitch; BOM line for the connector."

[[requirement]]
id = "R4"
category = "interface"
must = false
text = "The +5 V and ground pins of the power connector can be told apart from the board (silkscreen label or pin-1 marking)."
evidence = "PCB render, front silkscreen."

[[requirement]]
id = "R5"
category = "power"
must = true
text = "The board works from 5 V DC with no on-board regulator."
evidence = "Schematic: input connected directly to the LED circuit."

[[requirement]]
id = "R6"
category = "mechanical"
must = true
text = "The board outline fits within 25 mm x 20 mm."
evidence = "PCB Edge.Cuts dimensions; board outline Gerber."

[[requirement]]
id = "R7"
category = "layout"
must = true
text = "The PCB uses at most 2 copper layers, is fully routed, and passes DRC with JLCPCB-compatible rules."
evidence = "PCB layer stackup; DRC report with zero errors and zero unconnected items."

[[requirement]]
id = "R8"
category = "layout"
must = true
text = "The PCB copper connectivity matches the schematic netlist."
evidence = "Schematic-to-PCB netlist comparison in the evidence pack."

[[requirement]]
id = "R9"
category = "bom"
must = true
text = "Every assembled part has an LCSC part number that JLCPCB can source, and the CPL lists every SMT part."
evidence = "bom.csv LCSC column; BOM resolution report; cpl.csv."

[[requirement]]
id = "R10"
category = "layout"
must = false
text = "All components are placed on one side of the board."
evidence = "PCB render; cpl.csv layer column."
