# Judge panel, judging version 1: three judges from three different vendors (JUDGING.md).
# Each judge runs in its own native harness, opened on the submission branch, and is
# given prompts/judge-session.md. Changing any entry bumps `version` and re-scores
# every submission.
version = 1

# Every judge's environment provides the same inspection tools: kicad-cli (KiCad 10) and
# kicad-tools at this exact version on PATH (`uv tool install kicad-tools==0.22.0`).
# judging/prepare refuses to start a judge session with a different version.
kicad_tools_version = "0.22.0"

[[judge]]
vendor = "anthropic"
model = "claude-opus-5-5"
harness = "claude-code"

[[judge]]
vendor = "openai"
model = "gpt-6-astra"
harness = "codex-cli"

[[judge]]
vendor = "zhipu"
model = "glm-5.3"
harness = "opencode"
