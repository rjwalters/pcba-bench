# Judge panel, judging version 1: three judges from three different vendors (JUDGING.md).
# Each judge runs in its own native harness, opened on the submission branch, and is
# given prompts/judge-session.md. Changing any entry bumps `version` and re-scores
# every submission.
version = 1

[[judge]]
vendor = "anthropic"
model = "claude-opus-5-5"
harness = "claude-code"

[[judge]]
vendor = "openai"
model = "gpt-6-astra"
harness = "codex-cli"

[[judge]]
vendor = "zhipu"
model = "glm-5.3"
harness = "opencode"
